# This config file is used by ros2_control.
# Current execution path is fake/mock backend:
# MoveIt -> arm_controller(JTC) -> ros2_control -> mock_components/GenericSystem
# Future path keeps same controller interfaces while replacing hardware plugin.
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

arm_controller:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_nonzero_velocity_at_trajectory_end: true
